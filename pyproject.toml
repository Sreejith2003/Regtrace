[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "regtrace"
version = "0.0.1"
description = "Chunkless (tree-based) RAG for finding regulatory compliance gaps in policy documents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sreejith Suresh" }]
requires-python = ">=3.11"
keywords = ["rag", "llm", "gdpr", "compliance", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ollama>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
regtrace = "regtrace.cli:app"

[project.urls]
Repository = "https://github.com/Sreejith2003/Regtrace"

[tool.hatch.build.targets.wheel]
packages = ["src/regtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Typer reads defaults from function signatures; B008 doesn't apply there.
"src/regtrace/cli.py" = ["B008"]
